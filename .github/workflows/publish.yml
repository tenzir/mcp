name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for trusted publishing

jobs:
  test:
    name: Test
    uses: ./.github/workflows/tests.yml
    secrets:
      github-token: ${{ secrets.TENZIR_BOT_GITHUB_TOKEN }}

  build:
    name: Build distribution
    needs: test
    uses: ./.github/workflows/build.yml
    with:
      check-twine: true
    secrets:
      github-token: ${{ secrets.TENZIR_BOT_GITHUB_TOKEN }}

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    environment:
      name: pypi
      url: https://pypi.org/p/tenzir-mcp

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses trusted publishing - no API token needed when properly configured

  verify-installation:
    name: Verify installation
    needs: publish-to-pypi
    if: needs.publish-to-pypi.result == 'success' && github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Determine expected version
        id: expected-version
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="${tag#v}"
          echo "expected_version=$version" >> "$GITHUB_OUTPUT"

      - name: Wait for package availability
        env:
          EXPECTED_VERSION: ${{ steps.expected-version.outputs.expected_version }}
        run: |
          echo "Waiting for version $EXPECTED_VERSION to appear on PyPI..."
          for i in {1..30}; do
            version=$(curl -sf https://pypi.org/pypi/tenzir-mcp/json | jq -r '.info.version' || echo "")
            if [ "$version" = "$EXPECTED_VERSION" ]; then
              echo "Version $EXPECTED_VERSION is now available on PyPI"
              exit 0
            fi
            echo "Attempt $i: found version '$version', waiting 5s..."
            sleep 5
          done
          echo "Timeout waiting for version $EXPECTED_VERSION on PyPI" >&2
          exit 1

      - name: Verify correct version on PyPI
        env:
          EXPECTED_VERSION: ${{ steps.expected-version.outputs.expected_version }}
        run: |
          uv venv /tmp/verify-venv
          uv pip install --python /tmp/verify-venv tenzir-mcp
          INSTALLED=$(uv pip show --python /tmp/verify-venv tenzir-mcp | grep Version | cut -d' ' -f2)
          echo "Expected: $EXPECTED_VERSION"
          echo "Installed: $INSTALLED"
          if [ "$INSTALLED" != "$EXPECTED_VERSION" ]; then
            echo "::error::Version mismatch! Expected $EXPECTED_VERSION but got $INSTALLED"
            exit 1
          fi
          echo "Version verified successfully"
